<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gods Lies</title>
<meta name="description" content="A pigpen-style substitution cipher: mix grid and diamond symbol sets into a private alphabet, then encode and decode messages entirely in your browser." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Gods Lies" />
<meta property="og:description" content="A pigpen-style substitution cipher: mix grid and diamond symbol sets into a private alphabet, then encode and decode messages entirely in your browser." />
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#201a14" media="(prefers-color-scheme: dark)" />
<!-- Self-contained favicon: the classic pigpen "#" divider mark (see
     README's "Border cleanup" section), drawn inline so no extra asset
     file is needed and it stays crisp at any size. Its own light/dark
     media query mirrors the page's --accent colors. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.l%7Bstroke:%23a8621f%7D@media(prefers-color-scheme:dark)%7B.l%7Bstroke:%23d99a4e%7D%7D%3C/style%3E%3Cg class='l' stroke-width='3' stroke-linecap='round' fill='none'%3E%3Cline x1='11' y1='4' x2='11' y2='28'/%3E%3Cline x1='21' y1='4' x2='21' y2='28'/%3E%3Cline x1='4' y1='11' x2='28' y2='11'/%3E%3Cline x1='4' y1='21' x2='28' y2='21'/%3E%3C/g%3E%3C/svg%3E" />
<!-- Classic (non-module) script, before the stylesheets: must block
     rendering and run first so a saved theme choice is applied before any
     CSS paints -- see js/theme-init.js. -->
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/forms.css" />
<link rel="stylesheet" href="css/god-picker.css" />
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Gods Lies</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="header-controls">
      <button class="secondary theme-toggle" id="themeToggleBtn"></button>
      <button class="secondary lang-toggle" id="langToggleBtn"></button>
    </div>
  </div>
</div>

<section class="card tools-card">
<h2><span class="step-badge">1</span><span data-i18n="step_cipher"></span></h2>
<p class="hint" data-i18n="cipher_hint"></p>

<!-- Two halves of one grid, each holding exactly 4 same-sized tiles (see
     .godblock-row in the stylesheet): the live selection on the left, the
     classic pigpen reference on the right. Both use the identical
     .block-tile component and the identical 4-column track, so the two
     sides are always pixel-for-pixel the same size and the same height --
     they used to be a tile vs. a bordered 2-thumb "name card", which is
     why the right side never matched and left dead space above/below. -->
<div class="godblock-row">
  <div class="slot-col">
    <div class="col-label" data-i18n="selection_label"></div>
    <div class="slot-boxes">
      <div class="slot-box-col">
        <div class="block-tile" data-target="g0"><span class="swatch"></span></div>
        <div class="slot-caption" data-target="g0"></div>
      </div>
      <div class="slot-box-col">
        <div class="block-tile" data-target="d0"><span class="swatch"></span></div>
        <div class="slot-caption" data-target="d0"></div>
      </div>
      <div class="slot-box-col">
        <div class="block-tile" data-target="g1"><span class="swatch"></span></div>
        <div class="slot-caption" data-target="g1"></div>
      </div>
      <div class="slot-box-col">
        <div class="block-tile" data-target="d1"><span class="swatch"></span></div>
        <div class="slot-caption" data-target="d1"></div>
      </div>
    </div>
  </div>
  <!-- Both bulk controls in one wrapper, so .godblock-row keeps exactly
       the 4 children its ≥1240px track list is written for. -->
  <div class="selection-actions">
    <button class="secondary randomize-selection-btn" data-i18n="randomize_selection" data-i18n-title="title_randomize"></button>
    <button class="secondary clear-selection-btn" data-i18n="clear_selection"></button>
  </div>
  <div class="separator"></div>
  <div class="classic-col">
    <div class="col-label classic-label" data-i18n="classic_label"></div>
    <div class="classic-strip"></div>
  </div>
</div>

<div class="gallery other-gallery"></div>
</section>

<div class="page-wrap">
  <section class="card">
  <h2><span class="step-badge">2</span><span data-i18n="step_key"></span></h2>
  <p class="hint" data-i18n="key_hint"></p>
  <div class="row">
    <div>
      <label data-i18n="seed_label"></label>
      <input type="text" class="seed-input" data-i18n-placeholder="seed_placeholder" />
    </div>
  </div>
  <div>
    <button class="gen-btn" data-i18n="regen_btn"></button>
    <button class="secondary seed-word-btn" data-i18n="seed_word_btn"></button>
    <button class="secondary download-key-btn" data-i18n="download_btn"></button>
    <button class="secondary download-font-btn" data-i18n="download_font_btn"></button>
  </div>
  <div class="key-status" data-i18n="key_status_empty"></div>
  <div class="chart-grid chart-glyphs" style="margin-top:.9rem;"></div>
  </section>

  <section class="card">
  <h2><span class="step-badge">3</span><span data-i18n="step_message"></span></h2>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="write" data-i18n="tab_write"></button>
    <button class="tabbtn" data-tab="read" data-i18n="tab_read"></button>
  </div>

  <div class="tabpanel active" data-tab="write">
    <label for="write-plainText" data-i18n="plaintext_label"></label>
    <textarea id="write-plainText" data-i18n-placeholder="plaintext_placeholder"></textarea>
    <div class="row">
      <div><label for="write-moodInput" data-i18n="mood_label"></label><input type="text" id="write-moodInput" placeholder=":c" /></div>
      <div><label for="write-punctInput" data-i18n="punct_label"></label><input type="text" id="write-punctInput" placeholder="!" /></div>
    </div>
    <p class="hint" data-i18n="write_mood_hint"></p>
    <button id="write-encodeBtn" data-i18n="encode_btn"></button>

    <div class="field-row" style="margin-top:.9rem;">
      <label style="margin:0;" data-i18n="encoded_result_label"></label>
      <button class="small secondary" id="write-copyGlyphsBtn" data-i18n="copy_codes_btn"></button>
      <button class="small secondary" id="write-copyFontTextBtn" data-i18n="copy_font_text_btn"></button>
      <button class="small secondary" id="write-copyImageBtn" data-i18n="copy_image_btn"></button>
      <button class="small secondary" id="write-downloadImageBtn" data-i18n="download_image_btn"></button>
    </div>
    <!-- Footnote to the "Copy cipher text" button above it, not to the
         result below. -->
    <p class="hint" data-i18n="font_text_hint" style="margin-bottom:.6rem;"></p>
    <div class="glyph-stream" id="write-encodeGlyphs"></div>
    <!-- Mood/punctuation on their own row, never as cells in the stream:
         the stream is the ciphertext, these two are the envelope around
         it. Same row, same wording, in Read. -->
    <div class="tag-row" id="write-tagRow"></div>
    <div class="header-line" id="write-headerLine"></div>
    <div class="header-summary" id="write-headerSummary"></div>

    <!-- This box holds exactly what "Copy as codes" puts on the clipboard,
         so there's no second, slightly-different text path. -->
    <label for="write-fullTextOut" data-i18n="full_text_label"></label>
    <textarea id="write-fullTextOut" class="mono" readonly style="min-height:5rem;"></textarea>
  </div>

  <div class="tabpanel" data-tab="read">
    <p class="hint" data-i18n="read_hint"></p>
    <div class="row" style="margin-bottom:.3rem;">
      <button class="small" id="read-spaceBtn" data-i18n="space_btn"></button>
      <button class="small secondary" id="read-undoBtn" data-i18n="undo_btn"></button>
      <button class="small secondary" id="read-clearSeqBtn" data-i18n="clear_btn"></button>
    </div>
    <div class="glyph-stream editable" id="read-sequenceStrip"><span class="empty-hint" data-i18n="sequence_empty_hint"></span></div>

    <div class="field-row">
      <label for="read-plainOut" style="margin:0;" data-i18n="decoded_text_label"></label>
      <button class="small secondary" id="read-copyPlainBtn" data-i18n="copy_btn"></button>
    </div>
    <textarea id="read-plainOut" readonly></textarea>

    <details>
      <summary data-i18n="paste_summary"></summary>
      <p class="hint" data-i18n="paste_hint"></p>
      <textarea id="read-pasteIn" class="mono" data-i18n-placeholder="paste_placeholder"></textarea>
      <button class="small secondary" id="read-pasteBtn" data-i18n="decode_btn"></button>
      <div class="field-row">
        <label style="margin:0;" data-i18n="result_label"></label>
        <button class="small secondary" id="read-copyPasteBtn" data-i18n="copy_btn"></button>
      </div>
      <textarea id="read-pasteOut" readonly></textarea>
      <!-- Same row, same place under the result as Write's: this is the
           only Read path carrying a header, so the only one with
           mood/punctuation to show. -->
      <div class="tag-row" id="read-pasteMoodPunct"></div>
    </details>

    <details>
      <summary data-i18n="image_summary"></summary>
      <p class="hint" data-i18n="image_hint"></p>
      <div class="image-drop" id="read-imageDrop">
        <span data-i18n="image_drop_label"></span>
        <input type="file" id="read-imageInput" accept="image/*" hidden />
      </div>
      <div class="hint" id="read-imageStatus"></div>
      <div class="glyph-stream" id="read-imageGlyphs"></div>
      <div class="field-row">
        <label style="margin:0;" data-i18n="result_label"></label>
        <button class="small secondary" id="read-copyImageTextBtn" data-i18n="copy_btn"></button>
      </div>
      <textarea id="read-imageOut" readonly></textarea>
    </details>
  </div>
  </section>

  <footer>
    <p class="footer-tagline">Gods Lies &mdash; <span data-i18n="footer_text"></span></p>

    <div class="footer-info">
      <details>
        <summary data-i18n="about_summary"></summary>
        <p data-i18n="about_text"></p>
      </details>
      <details>
        <summary data-i18n="security_summary"></summary>
        <p data-i18n="security_text"></p>
      </details>
      <details>
        <summary data-i18n="license_summary"></summary>
        <p data-i18n-html="license_text"></p>
      </details>
      <details>
        <summary data-i18n="credits_summary"></summary>
        <p data-i18n="credits_text"></p>
      </details>
    </div>

    <p class="footer-links">
      <a href="https://github.com/Nevro-Pat/GodsLies" target="_blank" rel="noopener noreferrer" data-i18n="footer_github"></a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/Nevro-Pat/GodsLies/issues" target="_blank" rel="noopener noreferrer" data-i18n="footer_issues"></a>
    </p>
  </footer>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
