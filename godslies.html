<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gods Lies</title>
<meta name="description" content="A pigpen-style substitution cipher: mix grid and diamond symbol sets into a private alphabet, then encode and decode messages entirely in your browser." />
<meta property="og:type" content="website" />
<meta property="og:title" content="Gods Lies" />
<meta property="og:description" content="A pigpen-style substitution cipher: mix grid and diamond symbol sets into a private alphabet, then encode and decode messages entirely in your browser." />
<meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#201a14" media="(prefers-color-scheme: dark)" />
<!-- Self-contained favicon: the classic pigpen "#" divider mark (see
     README's "Border cleanup" section), drawn inline so no extra asset
     file is needed and it stays crisp at any size. Its own light/dark
     media query mirrors the page's --accent colors. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E.l%7Bstroke:%23a8621f%7D@media(prefers-color-scheme:dark)%7B.l%7Bstroke:%23d99a4e%7D%7D%3C/style%3E%3Cg class='l' stroke-width='3' stroke-linecap='round' fill='none'%3E%3Cline x1='11' y1='4' x2='11' y2='28'/%3E%3Cline x1='21' y1='4' x2='21' y2='28'/%3E%3Cline x1='4' y1='11' x2='28' y2='11'/%3E%3Cline x1='4' y1='21' x2='28' y2='21'/%3E%3C/g%3E%3C/svg%3E" />
<script>
  // Applied before first paint (this is a head script, so it blocks
  // rendering) so a saved manual theme choice takes effect immediately --
  // otherwise the page would flash the OS-default theme, then flip.
  try {
    var savedTheme = localStorage.getItem("godslies-theme");
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
  } catch { /* localStorage unavailable (e.g. blocked) -- falls back to OS theme */ }
</script>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4ecdc;
    --bg-card: #fbf6ea;
    --ink: #2b2320;
    --ink-soft: #6b5d4f;
    --border: #d8c9a8;
    --accent: #a8621f;
    --accent-soft: #e8d4b0;
    --shadow: 0 1px 3px rgba(60, 40, 10, .08), 0 1px 2px rgba(60, 40, 10, .1);
    --radius: 12px;
    --glyph-filter: none;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #201a14;
      --bg-card: #2a2219;
      --ink: #ecdfc8;
      --ink-soft: #b3a189;
      --border: #4a3f30;
      --accent: #d99a4e;
      --accent-soft: #4a3a22;
      --shadow: 0 1px 3px rgba(0, 0, 0, .3), 0 1px 2px rgba(0, 0, 0, .35);
      --glyph-filter: invert(1) sepia(.15);
    }
  }
  :root[data-theme="dark"] {
    --bg: #201a14; --bg-card: #2a2219; --ink: #ecdfc8; --ink-soft: #b3a189;
    --border: #4a3f30; --accent: #d99a4e; --accent-soft: #4a3a22;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 1px 2px rgba(0,0,0,.35);
    --glyph-filter: invert(1) sepia(.15);
  }
  :root[data-theme="light"] {
    --bg: #f4ecdc; --bg-card: #fbf6ea; --ink: #2b2320; --ink-soft: #6b5d4f;
    --border: #d8c9a8; --accent: #a8621f; --accent-soft: #e8d4b0;
    --shadow: 0 1px 3px rgba(60,40,10,.08), 0 1px 2px rgba(60,40,10,.1);
    --glyph-filter: none;
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    background: var(--bg); color: var(--ink);
    margin: 0; padding: 2.2rem 1.4rem 4rem;
    line-height: 1.5;
  }
  /* --- width: the app used to sit in one fixed 1080px column everywhere,
     which reads as small/static on a wide monitor. Ordinary prose/cards
     stay in a fluid but capped column (.page-wrap); the god-picking tools
     section (.tools-card) is allowed to breathe wider since it's a tile
     grid that benefits from more columns, not a paragraph. Neither goes
     truly edge-to-edge -- that broke line-length/readability. --- */
  .page-wrap { max-width: clamp(1080px, 82vw, 1440px); margin: 0 auto; }
  .tools-card { max-width: min(94vw, 1600px); margin: 0 auto 1.4rem; }

  .page-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; flex-wrap: wrap; }
  h1 {
    font-size: 2.1rem; margin: 0 0 .15rem; letter-spacing: .01em;
    font-variant: small-caps;
  }
  .tagline { color: var(--ink-soft); margin: 0 0 1.4rem; font-size: 1.02rem; max-width: 62ch; }
  h2 { font-size: 1.15rem; margin: 0 0 .3rem; font-variant: small-caps; letter-spacing: .02em; }
  .hint { color: var(--ink-soft); font-size: .88rem; margin: 0 0 1rem; }
  code, .mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }

  section.card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.4rem 1.5rem; margin-bottom: 1.4rem; box-shadow: var(--shadow);
  }
  .step-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--accent);
    color: #fff8ec; font-size: .82rem; font-weight: 700; margin-right: .5rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }

  label { display: block; margin: .5rem 0 .25rem; font-size: .85rem; color: var(--ink-soft); }
  input[type=text], textarea {
    width: 100%; box-sizing: border-box; padding: .55rem .7rem; font-size: .98rem;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    color: var(--ink); font-family: inherit;
  }
  input[type=text]:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 4rem; font-family: inherit; resize: vertical; }
  textarea.mono { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; }

  button {
    font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; font-size: .9rem;
    padding: .55rem 1.1rem; margin: .3rem .4rem 0 0; cursor: pointer;
    border: 1px solid var(--accent); border-radius: 8px;
    background: var(--accent); color: #fff8ec;
    transition: filter .12s ease, transform .05s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(1px); }
  button.secondary { background: transparent; color: var(--ink); border-color: var(--border); }
  button.secondary:hover { background: var(--accent-soft); }
  button.small { font-size: .78rem; padding: .3rem .6rem; }
  .header-controls { display: flex; gap: .5rem; flex-wrap: wrap; }
  .lang-toggle, .theme-toggle { margin-top: 0; white-space: nowrap; }
  details > summary { cursor: pointer; color: var(--ink-soft); font-size: .85rem; margin: .6rem 0; }
  details[open] > summary { margin-bottom: .9rem; }

  .row { display: flex; gap: .8rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 170px; }

  .field-row { display: flex; align-items: center; justify-content: space-between; gap: .6rem; margin: .6rem 0 .3rem; flex-wrap: wrap; }
  .field-row label { margin: 0; }
  .header-line { font-family: 'SF Mono', ui-monospace, Menlo, Consolas, monospace; font-size: .85rem; color: var(--ink-soft); margin-top: .5rem; word-break: break-all; }

  img.glyph, img.tile-preview { filter: var(--glyph-filter); }

  /* --- tabs: now only used for the local Write/Read switch inside step 3 --- */
  .tabbar { display: flex; gap: .4rem; margin-bottom: 1.4rem; border-bottom: 2px solid var(--border); }
  .tabbtn {
    background: transparent; color: var(--ink-soft); border: 1px solid transparent; border-bottom: none;
    border-radius: 10px 10px 0 0; padding: .65rem 1.6rem; font-size: 1.05rem;
    font-variant: small-caps; letter-spacing: .02em; margin: 0; box-shadow: none;
  }
  .tabbtn:hover { background: var(--accent-soft); filter: none; }
  .tabbtn.active { background: var(--bg-card); color: var(--ink); border-color: var(--border); position: relative; top: 2px; }
  .tabpanel { display: none; }
  .tabpanel.active { display: block; }

  /* --- slot boxes: 4 independent boxes (grid.1, diamond.1, grid.2,
     diamond.2), each a pure display of the current selection for that
     one slot, filled by clicking gallery tiles below (grid/diamond
     cycle independently). Sized to match .name-card .thumbs button
     below exactly -- same box, same glyph size -- rather than being
     their own smaller/nested design, so a slot preview and a gallery
     thumbnail read as the same kind of object. --- */
  .godblock-row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .slot-boxes { display: flex; gap: .6rem; flex-wrap: wrap; }
  .slot-box-col { display: flex; flex-direction: column; align-items: center; gap: .35rem; }
  /* Icon-only: the god name and grid/diamond label used to be printed on
     every tile, which read as small and cluttered for what's meant to be
     a quick-glance preview -- the glyph shape itself (a 3x3 grid vs. a
     diamond) already tells grid from diamond, same as the gallery
     thumbnails below never carry that label either. Full detail is still
     available via the title tooltip (see refreshUI()). Bigger than a
     gallery thumbnail on purpose now -- this is the primary "what's
     selected" readout, so it gets more visual weight, not the same
     weight as one option among 14. */
  .block-tile {
    width: 140px; height: 140px; border: 2px solid var(--border); border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg-card); transition: border-color .12s ease, background .12s ease;
  }
  .block-tile.filled[data-target="g0"] { background: rgba(168,98,31,.16); border-color: #a8621f; }
  .block-tile.filled[data-target="g1"] { background: rgba(138,74,74,.16); border-color: #8a4a4a; }
  .block-tile.filled[data-target="d0"] { background: rgba(74,127,94,.16); border-color: #4a7f5e; }
  .block-tile.filled[data-target="d1"] { background: rgba(74,107,127,.16); border-color: #4a6b7f; }
  /* Brief feedback when a click is rejected for creating a same-type
     duplicate (see assignByType) -- makes clear the click registered
     and was refused, not that the tile is unresponsive. */
  .block-tile.blocked { border-color: #c0392b !important; background: rgba(192,57,43,.18) !important; }
  .block-tile .swatch { width: 112px; height: 112px; display: flex; align-items: center; justify-content: center; }
  .block-tile .swatch img { width: 112px; height: 112px; }
  /* Caption below each box: the god's grid/diamond reference code (the
     same 2-digit codes the message header uses) so the selection is
     legible without needing to hover for the tooltip. If the same god
     was picked for both slots of this segment type, both codes would be
     identical (a code belongs to a god, not a slot) -- showing the name
     instead in that case is clearer than two matching numbers with no
     obvious reason why (see refreshUI()). */
  .slot-caption {
    font-size: .72rem; font-weight: 700; color: var(--ink-soft); text-align: center;
    min-height: 1em; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .slot-caption.duplicate { color: var(--accent); }
  /* Only the separator should stretch to the row's full height (it's a
     divider); everything else sizes to its own content -- align-items:
     stretch on the row itself used to balloon the Clear button up to
     match the classic-pigpen column's height, leaving it mostly empty. */
  .godblock-row > .clear-selection-btn {
    writing-mode: vertical-rl; align-self: stretch;
    padding: .5rem .4rem; font-size: .78rem; letter-spacing: .03em;
  }

  .separator { width: 2px; align-self: stretch; background: var(--border); }
  /* Fixed-size, not flex:1 -- it used to fill whatever space its siblings
     left over, so its width (and card sizes) silently depended on how
     wide the Clear button's translated label happened to render. Always
     holds exactly 2 cards, so a fixed track size keeps it identical
     regardless of language. margin-left:auto keeps it pinned to the
     row's right edge (its intended position) whether it's sharing the
     row with everything else or has wrapped onto its own line. */
  .classic-col { flex: 0 0 auto; max-width: 100%; margin-left: auto; }
  .classic-col .classic-label {
    font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--accent); margin-bottom: .6rem; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  /* flex, not grid -- always exactly 2 fixed-size cards, and flex-wrap
     lets them drop to a second line on a narrow viewport instead of a
     grid's fixed tracks forcing horizontal overflow. */
  .classic-col .gallery { display: flex; flex-wrap: wrap; }
  .classic-col .gallery .name-card { flex: 0 0 auto; }

  /* --- gallery --- */
  .gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: .9rem;
  }
  /* The 12-name other-gallery used auto-fill above, which packs as many
     190px+ columns as fit and leaves whatever's left as a short ragged
     last row (7+5, 5+5+2, ...). Explicit counts per breakpoint instead --
     each one an even divisor of 12, so every row always has the same
     number of cards. */
  .other-gallery { grid-template-columns: repeat(1, 1fr); }
  @media (min-width: 600px)  { .other-gallery { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 860px)  { .other-gallery { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 1120px) { .other-gallery { grid-template-columns: repeat(4, 1fr); } }
  @media (min-width: 1700px) { .other-gallery { grid-template-columns: repeat(6, 1fr); } }
  .name-card {
    border: 2px solid var(--border); border-radius: 12px; padding: .75rem;
    text-align: center; background: var(--bg); position: relative;
    transition: border-color .12s ease;
  }
  .name-card .thumbs { display: flex; gap: .5rem; justify-content: center; }
  .name-card .thumbs button {
    all: unset; cursor: pointer; width: 100px; height: 100px; border-radius: 8px;
    background: var(--bg-card); border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    transition: background .12s ease, border-color .12s ease;
  }
  .name-card .thumbs button:hover { border-color: var(--accent); }
  /* "lit" = this specific thumbnail (not just the card as a whole) is the one
     filling a slot -- background is set inline per-card in JS (solid tint for
     one slot, a gradient when the same god fills both slots of one segment
     type) so grid and diamond selections read exactly the same way. */
  .name-card .thumbs button.lit { border-color: transparent; }
  .name-card .thumbs img { width: 82px; height: 82px; }
  .name-card .name { font-size: .92rem; margin-top: .5rem; font-weight: 700; }
  .corner-tag {
    position: absolute; width: 18px; height: 18px; border-radius: 4px;
    display: none; align-items: center; justify-content: center;
    font-size: .62rem; font-weight: 700; color: #fff8ec; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .corner-tag.g0 { top: 5px; left: 5px; background: #a8621f; }
  .corner-tag.g1 { top: 5px; right: 5px; background: #8a4a4a; }
  .corner-tag.d0 { bottom: 5px; left: 5px; background: #4a7f5e; }
  .corner-tag.d1 { bottom: 5px; right: 5px; background: #4a6b7f; }

  /* --- code / chart strips (write result, alphabet chart) --- */
  .chart-grid {
    display: flex; flex-wrap: wrap; gap: 7px; border: 1px solid var(--border);
    background: var(--bg); padding: 12px; border-radius: 10px; min-height: 3.5rem;
  }
  .chart-grid .cell {
    width: 58px; height: 74px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; background: var(--bg-card); border-radius: 6px; position: relative;
  }
  .chart-grid img { max-width: 42px; max-height: 42px; }
  .chart-grid .cell.clickable { cursor: pointer; }
  .chart-grid .cell.clickable:hover { outline: 1px solid var(--accent); }
  .chart-grid button.cell { border: none; background: var(--bg-card); font: inherit; color: inherit; padding: 0; }

  /* --- write/read glyph streams: smaller, so a whole message is scannable at once --- */
  .glyph-stream {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px; border: 1px solid var(--border);
    background: var(--bg); padding: 10px; border-radius: 10px; min-height: 3rem;
  }
  .glyph-stream.editable { border-style: dashed; }
  .glyph-stream .cell {
    width: 34px; height: 34px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-card); border-radius: 5px;
  }
  .glyph-stream img { max-width: 24px; max-height: 24px; }
  .glyph-stream .lit { font-family: 'SF Mono', ui-monospace, monospace; font-size: .85rem; }
  .glyph-stream .space { width: 18px; display: flex; align-items: center; justify-content: center; }
  .glyph-stream .space::after { content: ""; width: 1px; height: 60%; background: var(--border); }
  .glyph-stream button.cell { border: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .glyph-stream button.cell:hover { outline: 1px solid #b23; }
  .glyph-stream .empty-hint { color: var(--ink-soft); font-size: .85rem; padding: .4rem; }
  /* mood/punct tags folded into the encoded-result stream: same family as a
     literal pass-through cell, but tinted so they read as "framing" rather
     than "part of the ciphertext". */
  .glyph-stream .tag-cell { width: auto; min-width: 34px; padding: 0 8px; background: var(--accent-soft); }
  .glyph-stream .tag-cell .lit { color: var(--accent); font-weight: 700; }

  .key-status {
    display: block; font-size: .9rem; color: var(--ink-soft); margin-top: .6rem;
    padding: .6rem .8rem; background: var(--bg); border-radius: 6px; border: 1px dashed var(--border);
  }
  .key-status.ready { color: var(--ink); border-style: solid; border-color: var(--accent-soft); }
  .key-status-title {
    font-weight: 700; color: var(--accent); margin-bottom: .4rem; text-transform: uppercase;
    letter-spacing: .04em; font-size: .78rem; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .key-status-rows { display: flex; flex-direction: column; gap: .2rem; }
  .key-status-row { display: flex; gap: .6rem; align-items: baseline; }
  .key-status-label {
    min-width: 4.5rem; color: var(--ink-soft); text-transform: uppercase; font-size: .68rem;
    letter-spacing: .04em; font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .key-status-value { font-weight: 600; color: var(--ink); }

  footer { text-align: center; color: var(--ink-soft); font-size: .8rem; margin-top: 2.5rem; }
  .footer-tagline { margin: 0 0 1.2rem; }
  .footer-info {
    max-width: 640px; margin: 0 auto 1.2rem; text-align: left;
    border-top: 1px solid var(--border); padding-top: 1rem;
  }
  .footer-info details { margin-bottom: .5rem; }
  .footer-info summary {
    cursor: pointer; color: var(--ink); font-weight: 600; font-size: .82rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  .footer-info p { margin: .5rem 0 0; line-height: 1.55; }
  .footer-info a, .footer-links a { color: var(--accent); }
  .footer-links { margin: 0; }
  .footer-links a { color: var(--ink-soft); text-decoration: underline; }
  .footer-links span { margin: 0 .4rem; }
</style>
</head>
<body>
<div class="page-wrap">
  <div class="page-header">
    <div>
      <h1>Gods Lies</h1>
      <p class="tagline" data-i18n="tagline"></p>
    </div>
    <div class="header-controls">
      <button class="secondary theme-toggle" id="themeToggleBtn"></button>
      <button class="secondary lang-toggle" id="langToggleBtn"></button>
    </div>
  </div>
</div>

<section class="card tools-card">
<h2><span class="step-badge">1</span><span data-i18n="step_cipher"></span></h2>
<p class="hint" data-i18n="cipher_hint"></p>

<div class="godblock-row">
  <div class="slot-boxes">
    <div class="slot-box-col">
      <div class="block-tile" data-target="g0"><span class="swatch"></span></div>
      <div class="slot-caption" data-target="g0"></div>
    </div>
    <div class="slot-box-col">
      <div class="block-tile" data-target="d0"><span class="swatch"></span></div>
      <div class="slot-caption" data-target="d0"></div>
    </div>
    <div class="slot-box-col">
      <div class="block-tile" data-target="g1"><span class="swatch"></span></div>
      <div class="slot-caption" data-target="g1"></div>
    </div>
    <div class="slot-box-col">
      <div class="block-tile" data-target="d1"><span class="swatch"></span></div>
      <div class="slot-caption" data-target="d1"></div>
    </div>
  </div>
  <button class="secondary clear-selection-btn" data-i18n="clear_selection"></button>
  <div class="separator"></div>
  <div class="classic-col">
    <div class="classic-label" data-i18n="classic_label"></div>
    <div class="gallery classic-gallery"></div>
  </div>
</div>

<div class="gallery other-gallery"></div>
</section>

<div class="page-wrap">
  <section class="card">
  <h2><span class="step-badge">2</span><span data-i18n="step_key"></span></h2>
  <p class="hint" data-i18n="key_hint"></p>
  <div class="row">
    <div>
      <label data-i18n="seed_label"></label>
      <input type="text" class="seed-input" data-i18n-placeholder="seed_placeholder" />
    </div>
  </div>
  <div>
    <button class="gen-btn" data-i18n="regen_btn"></button>
    <button class="secondary seed-word-btn" data-i18n="seed_word_btn"></button>
    <button class="secondary download-key-btn" data-i18n="download_btn"></button>
    <button class="secondary download-font-btn" data-i18n="download_font_btn"></button>
  </div>
  <div class="key-status" data-i18n="key_status_empty"></div>
  <div class="chart-grid chart-glyphs" style="margin-top:.9rem;"></div>
  </section>

  <section class="card">
  <h2><span class="step-badge">3</span><span data-i18n="step_message"></span></h2>

  <div class="tabbar">
    <button class="tabbtn active" data-tab="write" data-i18n="tab_write"></button>
    <button class="tabbtn" data-tab="read" data-i18n="tab_read"></button>
  </div>

  <div class="tabpanel active" data-tab="write">
    <label for="write-plainText" data-i18n="plaintext_label"></label>
    <textarea id="write-plainText" data-i18n-placeholder="plaintext_placeholder"></textarea>

let currentLang = localStorage.getItem("godslies-lang") || "en";

function t(key, vars) {
  let s = (STRINGS[currentLang] && STRINGS[currentLang][key]) ?? STRINGS.en[key] ?? key;
  if (vars) for (const [k, v] of Object.entries(vars)) s = s.replaceAll(`{{${k}}}`, v);
  return s;
}

// Real Greek/Greek-word deity names personifying a lie or deception,
// matched to the visual style each one's real hand-drawn symbols evoke.
// Hermès + Áte are shown in their own "classic pigpen" column, separate from
// the other 12, so the tool presents with a familiar/recognizable look
// before showing the exotic variants. List position has no bearing on
// the key/slot mapping -- it's display order only. Names are proper nouns
// and stay the same in both languages.
const CLASSIC_GODS = [["hermes", "Hermès"], ["ate", "Áte"]];
const OTHER_GODS = [
  ["horkos", "Hórkos"], ["arnesis", "Árnesis"], ["phantasos", "Phántasos"], ["dolos", "Dólos"],
  ["apate", "Apáte"], ["kolax", "Kólax"],
  ["lethe", "Léthe"], ["limos", "Limós"], ["lochos", "Lóchos"],
  ["daidalos", "Daídalos"], ["mnemon", "Mnémon"], ["loxias", "Loxías"],
];
const GODS = [...CLASSIC_GODS, ...OTHER_GODS];
const GOD_LABEL = Object.fromEntries(GODS);

// Two-digit reference codes for the notebook message header (see README
// "Message format"). Mirrors godslies.py's GOD_CODES exactly -- keep the
// two in sync if this ever changes. First 9 are the real notebook's own
// numbers (grid=N0, diamond=NN); the last 5 extend that "round" spirit
// with digit-reversal pairs instead of the notebook's original plain
// sequential tail.
const GOD_CODES = {
  hermes: ["10","11"], ate: ["20","22"], kolax: ["30","33"], loxias: ["40","44"],
  apate: ["50","55"], mnemon: ["60","66"], dolos: ["70","77"], daidalos: ["80","88"],
  phantasos: ["90","99"], lochos: ["15","51"], arnesis: ["25","52"], limos: ["35","53"],
  horkos: ["45","54"], lethe: ["65","56"],
};
const CODE_TO_GOD = Object.fromEntries(
  Object.entries(GOD_CODES).flatMap(([god, codes]) => codes.map(code => [code, god]))
);

function godRefCode(gridGod, diamondGod) {
  if (gridGod === diamondGod) return GOD_CODES[gridGod][0];
  return `${GOD_CODES[gridGod][0]}.${GOD_CODES[diamondGod][1]}`;
}
function parseGodRef(ref) {
  if (ref.includes(".")) {
    const [gridCode, diamondCode] = ref.split(".");
    return [CODE_TO_GOD[gridCode], CODE_TO_GOD[diamondCode]];
  }
  const god = CODE_TO_GOD[ref];
  return [god, god];
}

// Derive a full key straight from a message's own header -- no need for
// the selected slots to match, or even be filled in at all.
function keyFromHeader(slotA, slotB, seed) {
  const [g0, d0] = parseGodRef(slotA);
  const [g1, d1] = parseGodRef(slotB);
  if (!g0 || !d0 || !g1 || !d1) throw new Error(t("unknown_god_code_error"));
  return generateKey([g0, g1], [d0, d1], seed);
}

const GRID9_POS = [1,2,3,4,5,6,7,8,9];
const DIAMOND4_POS = ["N","E","S","W"];

// Clamped/minimum-floor glyph scaling: boost a glyph that only fills a
// small fraction of its 160x160 canvas toward a comfortable minimum
// on-screen size, capped so it never grows to look as big as a full
// glyph -- keeps the underlying assets untouched (their true relative
// scale still matters, see extract_assets.py's clean_cell) while fixing
// the "some symbols huge, some tiny" side-by-side look in the chart.
//
// Diamond4 arms need a much higher cap than grid9 cells do: most of
// them are legitimately thin marks (a chevron, sometimes just a dot --
// e.g. Apáte's E arm, or Áte's chevron-plus-dot) with far less native
// ink than a full digit, so the old 1.8x cap left them looking tiny
// next to their own god's grid9 style. 3.0x brings ordinary diamond
// arms close to grid9's visual weight while still keeping an actual
// dot recognizable as a dot, not blown up into a blob -- grid9 cells
// almost never need more than ~1.4x anyway, so raising the shared cap
// only changes diamonds in practice.
const TARGET_FILL = 0.55;
const MAX_BOOST = 3.0;

function assetPath(name, seg, pos) { return `assets/${name}/${seg}_${pos}.png`; }
function fillScale(name, seg, pos) {
  const fill = FILL_MANIFEST[`${name}/${seg}_${pos}`];
  if (!fill) return 1;
  return Math.min(MAX_BOOST, Math.max(1, TARGET_FILL / fill));
}

function allSlots() {
  const slots = [];
  for (const which of [0,1]) for (const p of GRID9_POS) slots.push(["grid9", which, p]);
  for (const which of [0,1]) for (const p of DIAMOND4_POS) slots.push(["diamond4", which, p]);
  return slots;
}
const ALL_SLOTS = allSlots();
const SLOT_ORDER = ["g0", "g1", "d0", "d1"];
const SLOT_LABEL_KEY = { g0: "slot_grid1", g1: "slot_grid2", d0: "slot_diamond1", d1: "slot_diamond2" };
// The other slot of the same segment type -- used to block picking the
// same god for both grid slots (or both diamond slots): doing so would
// mean 18 of the alphabet's 26 letters reuse just one visual style,
// making the symbol pool needlessly easy to pattern-match.
const OTHER_SLOT_OF_TYPE = { g0: "g1", g1: "g0", d0: "d1", d1: "d0" };

// One color per slot (matches the .block-tile[data-target] tints below) used
// to colorize whichever gallery card/thumbnail is filling that slot -- solid
// for borders, a softer alpha version for tinted button backgrounds.
const SLOT_COLORS = { g0: "#a8621f", g1: "#8a4a4a", d0: "#4a7f5e", d1: "#4a6b7f" };
const SLOT_TINTS = {
  g0: "rgba(168,98,31,.22)", g1: "rgba(138,74,74,.22)",
  d0: "rgba(74,127,94,.22)", d1: "rgba(74,107,127,.22)",
};
// A single slot's color/tint applies directly; 2+ (the same god filling more
// than one slot -- e.g. a full godblock using one god for both its grid and
// diamond) blend into a gradient instead of letting one plain color hide
// that it's doing double duty.
function blend(colors) {
  if (colors.length === 0) return "";
  if (colors.length === 1) return colors[0];
  return `linear-gradient(135deg, ${colors.join(", ")})`;
}

function slotCode(seg, which, pos) { return (seg === "grid9" ? "G" : "D") + pos + (which ? "." : ""); }
function parseCode(code) {
  code = code.trim();
  const which = code.endsWith(".") ? 1 : 0;
  if (which) code = code.slice(0, -1);
  const seg = code[0].toUpperCase() === "G" ? "grid9" : "diamond4";
  const posStr = code.slice(1);
  const pos = seg === "grid9" ? parseInt(posStr, 10) : posStr.toUpperCase();
  return [seg, which, pos];
}

function seededRng(seedStr) {
  let h = 1779033703 ^ seedStr.length;
  for (let i = 0; i < seedStr.length; i++) {
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return function () {
    h = Math.imul(h ^ (h >>> 16), 2246822519);
    h = Math.imul(h ^ (h >>> 13), 3266489917);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
}

function generateKey(grid9Names, diamond4Names, seed) {
  seed = seed || String(Math.floor(Math.random() * 1e9));
  const rng = seededRng(seed);
  const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  for (let i = letters.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [letters[i], letters[j]] = [letters[j], letters[i]];
  }
  const letter_to_slot = {};
  letters.forEach((letter, i) => { letter_to_slot[letter] = ALL_SLOTS[i]; });
  return { grid9_gods: grid9Names, diamond4_gods: diamond4Names, seed, letter_to_slot };
}

function nameFor(key, seg, which) {
  return (seg === "grid9" ? key.grid9_gods : key.diamond4_gods)[which];
}

// The cipher only has 26 letter slots, so accented/ligature characters
// (French, and most other Latin-script languages) fold to their plain
// base letter before encoding -- é/è/ê/ë -> E, ç -> C, œ -> OE, etc. This
// is one-way: decoding a message back returns the base letter, not the
// original accent (there's no 27th+ slot to round-trip it through).
const LIGATURE_EXPANSIONS = { "œ": "oe", "Œ": "OE", "æ": "ae", "Æ": "AE", "ß": "ss", "ø": "o", "Ø": "O" };
function foldForCipher(text) {
  let expanded = "";
  for (const ch of text) expanded += LIGATURE_EXPANSIONS[ch] ?? ch;
  return expanded.normalize("NFD").replace(/\p{Diacritic}/gu, "");
}

function encode(text, key) {
  const tokens = [];
  for (const ch of foldForCipher(text)) {
    if (/[a-zA-Z]/.test(ch)) {
      const slot = key.letter_to_slot[ch.toUpperCase()];
      tokens.push(slotCode(slot[0], slot[1], slot[2]));
    } else if (ch === " ") tokens.push("/");
    else tokens.push(ch);
  }
  return tokens.join(" ");
}

function decode(codeString, key) {
  const slotToLetter = {};
  for (const [letter, [seg, which, pos]] of Object.entries(key.letter_to_slot)) {
    slotToLetter[slotCode(seg, which, pos)] = letter;
  }
  return codeString.split(/\s+/).filter(Boolean).map(tok => {
    if (tok === "/") return " ";
    try {
      const [seg, which, pos] = parseCode(tok);
      return slotToLetter[slotCode(seg, which, pos)] ?? tok;
    } catch { return tok; }
  }).join("");
}

function glyphImg(seg, which, pos, key, cls = "glyph") {
  const name = nameFor(key, seg, which);
  const img = document.createElement("img");
  img.className = cls;
  img.src = assetPath(name, seg, pos);
  img.alt = `${name} ${seg} ${pos}`;
  const posLabel = seg === "grid9" ? t("title_glyph_cell", { pos }) : t("title_glyph_arm", { pos });
  img.title = `${GOD_LABEL[name] || name} — ${posLabel}`;
  const scale = fillScale(name, seg, pos);
  if (scale > 1) img.style.transform = `scale(${scale.toFixed(2)})`;
  return img;
}

// A literal text cell (not a glyph) -- used for pass-through punctuation
// inside a coded token stream, and for the mood/punctuation tags framing
// the encoded result. Built with textContent (never innerHTML) since this
// carries raw user-typed text.
function litCell(text, tag = false) {
  const cell = document.createElement("div");
  cell.className = tag ? "cell tag-cell" : "cell";
  const span = document.createElement("span");
  span.className = "lit";
  span.textContent = text;
  cell.appendChild(span);
  return cell;
}

// Shared renderer for both the encode result (read-only) and the decode
// sequence being built (click-to-remove) -- smaller cells than the chart
// so a full message stays scannable at a glance, with a thin divider
// (not a blank gap) marking each word break.
function renderGlyphStream(tokens, key, container, onRemove) {
  container.innerHTML = "";
  if (tokens.length === 0) {
    container.innerHTML = `<span class="empty-hint">${onRemove ? t("sequence_empty_hint") : t("nothing_encoded_yet")}</span>`;
    return;
  }
  tokens.forEach((tok, i) => {
    if (tok === "/") {
      const sp = document.createElement("div");
      sp.className = "space";
      if (onRemove) { sp.style.cursor = "pointer"; sp.title = t("title_click_to_remove"); sp.onclick = () => onRemove(i); }
      container.appendChild(sp);
      return;
    }
    let cell;
    if (/^[GD]/i.test(tok) && tok.length >= 2) {
      try {
        const [seg, which, pos] = parseCode(tok);
        cell = document.createElement(onRemove ? "button" : "div");
        cell.className = "cell";
        cell.appendChild(glyphImg(seg, which, pos, key));
      } catch { cell = litCell(tok); }
    } else {
      cell = litCell(tok);
    }
    if (onRemove) { cell.title = t("title_click_to_remove"); cell.onclick = () => onRemove(i); }
    container.appendChild(cell);
  });
}

// Renders the coded body, then frames it with the mood tag (front) and
// punctuation (back) as distinct "tag" cells -- display only, doesn't
// change lastWriteCoded (still just the coded body, used for copy/decode).
function renderWriteResult(coded, mood, punct, key, container) {
  renderGlyphStream(coded.split(/\s+/).filter(Boolean), key, container);
  if (container.querySelector(".empty-hint") && !mood && !punct) return;
  if (mood) container.insertBefore(litCell(mood, true), container.firstChild);
  if (punct) container.appendChild(litCell(punct, true));
}

// `onClick(seg, which, pos)`, when given, turns every cell into a button
// that appends its symbol to a sequence being built -- used by Read so
// the alphabet chart doubles as the decode input surface.
function renderChart(key, container, onClick) {
  container.innerHTML = "";
  const letters = Object.keys(key.letter_to_slot).sort();
  for (const letter of letters) {
    const [seg, which, pos] = key.letter_to_slot[letter];
    const cell = document.createElement(onClick ? "button" : "div");
    cell.className = "cell" + (onClick ? " clickable" : "");
    if (onClick) { cell.type = "button"; cell.title = t("title_click_to_add", { letter }); }
    cell.appendChild(glyphImg(seg, which, pos, key));
    if (onClick) cell.onclick = () => onClick(seg, which, pos);
    container.appendChild(cell);
  }
}

// ============================================================================
// In-browser font generator: builds a real, installable .ttf from the
// current key entirely client-side (no server, no Python) -- the same idea
// as make_font.py, using GLYPH_CONTOURS (baked ahead of time by
// `python make_font.py --bake-html`; see that block's comment above for why
// tracing can't happen here at runtime instead) rather than re-tracing
// images. Hand-rolled minimal TrueType writer, not a vendored font library
// -- this page stays a single self-contained file with no build step, and
// a from-scratch simple-glyph-only TTF (no hinting, no composites, no
// curves -- these are traced line art, straight-line contours only) is a
// small enough slice of the spec to implement directly.
// ============================================================================

const FONT_UNITS_PER_EM = 1000;
const FONT_GLYPH_TOP = 720;   // every symbol scales to fit under this height, sitting on the baseline
const FONT_ADVANCE = 820;
const FONT_SPACE_ADVANCE = 500;
const FONT_ASCENT = 900;
const FONT_DESCENT = -200;
const FONT_CANVAS = 160;      // matches extract_assets.py's CANVAS -- the pixel space GLYPH_CONTOURS is traced in

// --- minimal big-endian binary writer (TrueType is big-endian throughout) ---
class ByteWriter {
  constructor() { this.chunks = []; this.length = 0; }
  u8(v) { this.chunks.push(Uint8Array.of(v & 0xFF)); this.length += 1; return this; }
  u16(v) { const b = new Uint8Array(2); new DataView(b.buffer).setUint16(0, v & 0xFFFF, false); this.chunks.push(b); this.length += 2; return this; }
  i16(v) { const b = new Uint8Array(2); new DataView(b.buffer).setInt16(0, v, false); this.chunks.push(b); this.length += 2; return this; }
  u32(v) { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, v >>> 0, false); this.chunks.push(b); this.length += 4; return this; }
  tag(s) { this.chunks.push(new TextEncoder().encode((s + "    ").slice(0, 4))); this.length += 4; return this; }
  bytes(arr) { this.chunks.push(arr); this.length += arr.length; return this; }
  toUint8Array() {
    const out = new Uint8Array(this.length);
    let off = 0;
    for (const c of this.chunks) { out.set(c, off); off += c.length; }
    return out;
  }
}

function padTo4(bytes) {
  const rem = bytes.length % 4;
  if (rem === 0) return bytes;
  const out = new Uint8Array(bytes.length + (4 - rem));
  out.set(bytes);
  return out;
}

function tableChecksum(bytes) {
  let sum = 0;
  const len4 = Math.ceil(bytes.length / 4) * 4;
  for (let i = 0; i < len4; i += 4) {
    const b0 = bytes[i] || 0, b1 = bytes[i + 1] || 0, b2 = bytes[i + 2] || 0, b3 = bytes[i + 3] || 0;
    sum = (sum + (((b0 << 24) | (b1 << 16) | (b2 << 8) | b3) >>> 0)) >>> 0;
  }
  return sum >>> 0;
}

// glyf, simple glyphs only: every point on-curve (straight lines between
// them, no quadratic curves -- these are traced line art, not calligraphy),
// and always 2-byte coordinate deltas (never the compact 1-byte "short"
// form). Less compact, but removes an entire class of off-by-one risk for
// a few hundred extra bytes on a font that's a few dozen KB either way.
function encodeSimpleGlyph(contours) {
  // contours: array of arrays of [x, y] integer font-unit points, not
  // repeating the first point at the end of each contour.
  if (contours.length === 0) return { data: new Uint8Array(0), xMin: 0, yMin: 0, xMax: 0, yMax: 0, numPoints: 0, numContours: 0 };
  const allPoints = [];
  const endPts = [];
  for (const c of contours) {
    for (const p of c) allPoints.push(p);
    endPts.push(allPoints.length - 1);
  }
  let xMin = Infinity, yMin = Infinity, xMax = -Infinity, yMax = -Infinity;
  for (const [x, y] of allPoints) {
    if (x < xMin) xMin = x; if (x > xMax) xMax = x;
    if (y < yMin) yMin = y; if (y > yMax) yMax = y;
  }
  const w = new ByteWriter();
  w.i16(contours.length);
  w.i16(xMin); w.i16(yMin); w.i16(xMax); w.i16(yMax);
  for (const e of endPts) w.u16(e);
  w.u16(0); // instructionLength
  for (let i = 0; i < allPoints.length; i++) w.u8(0x01); // on-curve, not-short x, not-short y
  let prevX = 0;
  for (const [x] of allPoints) { w.i16(x - prevX); prevX = x; }
  let prevY = 0;
  for (const [, y] of allPoints) { w.i16(y - prevY); prevY = y; }
  return { data: w.toUint8Array(), xMin, yMin, xMax, yMax, numPoints: allPoints.length, numContours: contours.length };
}

// Raw baked pixel-space contours ([x,y,x,y,...] flat per polygon, from
// GLYPH_CONTOURS) -> font-unit point lists for one glyph. Mirrors
// make_font.py's build_glyph() exactly (same GLYPH_TOP/CANVAS constants,
// same y-flip -- images are top-down, font em-space is bottom-up from the
// baseline) so the browser-built font matches the Python one for the same
// key.
function contoursToFontPoints(flatContours) {
  const scale = FONT_GLYPH_TOP / FONT_CANVAS;
  return flatContours.map(flat => {
    const pts = [];
    for (let i = 0; i < flat.length; i += 2) {
      const x = flat[i], y = flat[i + 1];
      pts.push([Math.round(x * scale), Math.round((FONT_CANVAS - y) * scale)]);
    }
    return pts;
  });
}

function glyphContoursFor(god, seg, pos) {
  return GLYPH_CONTOURS[`${god}/${seg}_${pos}`] || [];
}

// cmap format 4, one segment per mapped codepoint. Less compact than
// merging consecutive codepoints that happen to share a constant
// glyph-index delta into shared segments, but trivially correct for any
// mapping pattern without having to detect which runs are safe to merge
// -- including many-to-one accent folding (à/á/â/... all landing on the
// same "A" glyph), which a naive constant-delta run can't represent.
function buildCmapFormat4(cmapEntries) {
  const codes = [...cmapEntries.keys()].sort((a, b) => a - b);
  const segments = codes.map(cp => {
    const gid = cmapEntries.get(cp);
    let delta = gid - cp;
    while (delta < -32768) delta += 65536;
    while (delta > 32767) delta -= 65536;
    return { start: cp, end: cp, delta };
  });
  segments.push({ start: 0xFFFF, end: 0xFFFF, delta: 1 }); // required terminator segment
  const segCount = segments.length;
  const pow2 = 2 ** Math.floor(Math.log2(segCount));
  const searchRange = 2 * pow2;
  const entrySelector = Math.floor(Math.log2(segCount));
  const rangeShift = 2 * segCount - searchRange;

  const w = new ByteWriter();
  w.u16(4);
  const lengthPos = w.length; w.u16(0); // patched below, once the final byte length is known
  w.u16(0); // language
  w.u16(segCount * 2);
  w.u16(searchRange);
  w.u16(entrySelector);
  w.u16(rangeShift);
  for (const s of segments) w.u16(s.end);
  w.u16(0); // reservedPad
  for (const s of segments) w.u16(s.start);
  for (const s of segments) w.i16(s.delta);
  for (const s of segments) w.u16(0); // idRangeOffset -- always 0, we only ever use idDelta
  const bytes = w.toUint8Array();
  new DataView(bytes.buffer).setUint16(lengthPos, bytes.length, false);
  return bytes;
}

function buildCmapTable(cmapEntries) {
  const sub = buildCmapFormat4(cmapEntries);
  const headerSize = 4 + 2 * 8;
  const w = new ByteWriter();
  w.u16(0); w.u16(2);
  w.u16(3); w.u16(1); w.u32(headerSize); // Windows, Unicode BMP
  w.u16(0); w.u16(3); w.u32(headerSize); // Unicode, BMP
  w.bytes(sub);
  return w.toUint8Array();
}

function buildHeadTable(unitsPerEm, xMin, yMin, xMax, yMax, indexToLocFormat) {
  const w = new ByteWriter();
  w.u16(1); w.u16(0);          // version 1.0
  w.u16(1); w.u16(0);          // fontRevision 1.0
  w.u32(0);                    // checkSumAdjustment -- patched in after the whole font is assembled
  w.u32(0x5F0F3CF5);           // magicNumber
  w.u16(0);                    // flags
  w.u16(unitsPerEm);
  w.u32(0); w.u32(0);          // created
  w.u32(0); w.u32(0);          // modified
  w.i16(xMin); w.i16(yMin); w.i16(xMax); w.i16(yMax);
  w.u16(0);                    // macStyle
  w.u16(8);                    // lowestRecPPEM
  w.i16(2);                    // fontDirectionHint
  w.i16(indexToLocFormat);
  w.i16(0);                    // glyphDataFormat
  return w.toUint8Array();
}

function buildHheaTable(ascent, descent, advanceWidthMax, minLSB, minRSB, xMaxExtent, numberOfHMetrics) {
  const w = new ByteWriter();
  w.u16(1); w.u16(0);
  w.i16(ascent); w.i16(descent); w.i16(0); // lineGap
  w.u16(advanceWidthMax);
  w.i16(minLSB); w.i16(minRSB); w.i16(xMaxExtent);
  w.i16(1); w.i16(0); w.i16(0); // caretSlopeRise/Run/Offset
  w.i16(0); w.i16(0); w.i16(0); w.i16(0); // reserved
  w.i16(0); // metricDataFormat
  w.u16(numberOfHMetrics);
  return w.toUint8Array();
}

function buildMaxpTable(numGlyphs, maxPoints, maxContours) {
  const w = new ByteWriter();
  w.u32(0x00010000);
  w.u16(numGlyphs);
  w.u16(maxPoints); w.u16(maxContours);
  w.u16(0); w.u16(0); // maxCompositePoints/Contours -- no composite glyphs
  w.u16(2);           // maxZones
  w.u16(0); w.u16(0); w.u16(0); w.u16(0); w.u16(0); // maxTwilightPoints, maxStorage, maxFunctionDefs, maxInstructionDefs, maxStackElements
  w.u16(0); w.u16(0); w.u16(0); // maxSizeOfInstructions, maxComponentElements, maxComponentDepth
  return w.toUint8Array();
}

function buildHmtxTable(metrics) {
  const w = new ByteWriter();
  for (const [aw, lsb] of metrics) { w.u16(aw); w.i16(lsb); }
  return w.toUint8Array();
}

function buildLocaTableLong(offsets) {
  const w = new ByteWriter();
  for (const o of offsets) w.u32(o);
  return w.toUint8Array();
}

function buildNameTable(strings) {
  const nameIDs = [1, 2, 3, 4, 5, 6];
  const records = [];
  const blobs = [];
  let offset = 0;
  for (const id of nameIDs) {
    const str = strings[id];
    const bytes = new Uint8Array(str.length * 2);
    const dv = new DataView(bytes.buffer);
    for (let i = 0; i < str.length; i++) dv.setUint16(i * 2, str.charCodeAt(i), false);
    records.push({ nameID: id, length: bytes.length, offset });
    blobs.push(bytes);
    offset += bytes.length;
  }
  const w = new ByteWriter();
  w.u16(0); // format
  w.u16(records.length);
  w.u16(6 + records.length * 12); // storageOffset: 6-byte header + 12 bytes/record
  for (const r of records) w.u16(3).u16(1).u16(0x0409).u16(r.nameID).u16(r.length).u16(r.offset);
  for (const b of blobs) w.bytes(b);
  return w.toUint8Array();
}

function buildPostTable() {
  const w = new ByteWriter();
  w.u32(0x00030000); // version 3.0 -- no per-glyph names, smallest valid form
  w.u32(0); w.i16(0); w.i16(0);
  w.u32(0);
  w.u32(0); w.u32(0); w.u32(0); w.u32(0);
  return w.toUint8Array();
}

function buildOS2Table(ascent, descent, avgCharWidth) {
  const w = new ByteWriter();
  w.u16(4);
  w.i16(Math.round(avgCharWidth));
  w.u16(400); w.u16(5); w.u16(0);                 // usWeightClass, usWidthClass, fsType
  w.i16(650); w.i16(700); w.i16(0); w.i16(140);   // subscript size/offset (rough defaults)
  w.i16(650); w.i16(700); w.i16(0); w.i16(480);   // superscript size/offset
  w.i16(50); w.i16(260);                          // strikeout size/position
  w.i16(0);                                       // sFamilyClass
  for (let i = 0; i < 10; i++) w.u8(0);           // panose ("any")
  w.u32(0b1111); w.u32(0); w.u32(0); w.u32(0);    // unicodeRange1-4: Basic Latin + Latin-1 Supp + Latin Ext-A/B
  w.tag("NONE");                                   // achVendID
  w.u16(0x0040);                                   // fsSelection: REGULAR
  w.u16(0x0020); w.u16(0x017F);                    // usFirstCharIndex/usLastCharIndex
  w.i16(ascent); w.i16(descent); w.i16(90);        // sTypoAscender/Descender/LineGap
  w.u16(ascent); w.u16(-descent);                  // usWinAscent/Descent
  w.u32(1); w.u32(0);                              // ulCodePageRange1/2: Latin1
  w.i16(500); w.i16(ascent);                       // sxHeight, sCapHeight (rough)
  w.u16(0); w.u16(0x0020); w.u16(1);               // usDefaultChar, usBreakChar, usMaxContext
  return w.toUint8Array();
}

// Assembles the full sfnt binary: table directory (sorted by tag, as
// required) + each table padded to a 4-byte boundary, then patches in the
// whole-font checksum adjustment that `head` reserves space for -- per
// spec, computed treating that field as 0, which is exactly the state
// `bytes` is still in at the point tableChecksum(bytes) runs below.
function assembleFont(tables) {
  const tags = Object.keys(tables).sort();
  const numTables = tags.length;
  const entrySelector = Math.floor(Math.log2(numTables));
  const searchRange = (2 ** entrySelector) * 16;
  const rangeShift = numTables * 16 - searchRange;

  const headerSize = 12 + numTables * 16;
  const padded = {};
  let offset = headerSize;
  const dir = [];
  for (const t of tags) {
    const raw = tables[t];
    const p = padTo4(raw);
    padded[t] = p;
    dir.push({ tag: t, checksum: tableChecksum(p), offset, length: raw.length });
    offset += p.length;
  }

  const w = new ByteWriter();
  w.u32(0x00010000);
  w.u16(numTables); w.u16(searchRange); w.u16(entrySelector); w.u16(rangeShift);
  for (const e of dir) { w.tag(e.tag); w.u32(e.checksum); w.u32(e.offset); w.u32(e.length); }
  for (const t of tags) w.bytes(padded[t]);

  const bytes = w.toUint8Array();
  const headEntry = dir.find(e => e.tag === "head");
  const wholeFontSum = tableChecksum(bytes);
  const adjustment = (0xB1B0AFBA - wholeFontSum) >>> 0;
  new DataView(bytes.buffer).setUint32(headEntry.offset + 8, adjustment, false);
  return bytes;
}

// Every precomposed Latin letter that NFD-decomposes to a plain A-Z/a-z
// base maps to that base letter's glyph too -- same idea as
// make_font.py's accented_cmap_extra(), so typing an ordinary accented
// letter doesn't show a blank box. Ligatures (no single-letter NFD
// decomposition -- œ's, if any, is to TWO letters) are left undefined,
// same as digits/punctuation.
function accentedCmapExtra(baseLetterGlyphId) {
  const extra = new Map();
  for (let cp = 0x00C0; cp < 0x0250; cp++) {
    const ch = String.fromCodePoint(cp);
    const base = ch.normalize("NFD")[0];
    if (base !== ch && baseLetterGlyphId.has(base)) extra.set(cp, baseLetterGlyphId.get(base));
  }
  return extra;
}

function buildFontFromKey(key, familyName) {
  const glyphOrder = [".notdef", "space"];
  const glyphData = [encodeSimpleGlyph([]), encodeSimpleGlyph([])];
  const advances = [[FONT_ADVANCE, 0], [FONT_SPACE_ADVANCE, 0]];
  const cmap = new Map([[32, 1]]); // space -> glyph index 1
  const baseLetterGlyphId = new Map();

  let maxPoints = 0, maxContours = 0;
  let fxMin = 0, fyMin = 0, fxMax = 0, fyMax = 0;

  for (const letter of "ABCDEFGHIJKLMNOPQRSTUVWXYZ") {
    const [seg, which, pos] = key.letter_to_slot[letter];
    const god = (seg === "grid9" ? key.grid9_gods : key.diamond4_gods)[which];
    const contours = contoursToFontPoints(glyphContoursFor(god, seg, pos));
    const g = encodeSimpleGlyph(contours);
    const glyphIndex = glyphOrder.length;
    glyphOrder.push(`cipher.${letter}`);
    glyphData.push(g);
    advances.push([FONT_ADVANCE, g.xMin]);
    cmap.set(letter.charCodeAt(0), glyphIndex);
    cmap.set(letter.toLowerCase().charCodeAt(0), glyphIndex);
    baseLetterGlyphId.set(letter, glyphIndex);
    baseLetterGlyphId.set(letter.toLowerCase(), glyphIndex);
    maxPoints = Math.max(maxPoints, g.numPoints);
    maxContours = Math.max(maxContours, g.numContours);
    if (g.numContours > 0) {
      fxMin = Math.min(fxMin, g.xMin); fyMin = Math.min(fyMin, g.yMin);
      fxMax = Math.max(fxMax, g.xMax); fyMax = Math.max(fyMax, g.yMax);
    }
  }
  for (const [cp, gid] of accentedCmapExtra(baseLetterGlyphId)) cmap.set(cp, gid);

  const numGlyphs = glyphOrder.length;
  const glyfWriter = new ByteWriter();
  const locaOffsets = [0];
  for (const g of glyphData) { glyfWriter.bytes(padTo4(g.data)); locaOffsets.push(glyfWriter.length); }

  const tables = {
    "cmap": buildCmapTable(cmap),
    "glyf": glyfWriter.toUint8Array(),
    "head": buildHeadTable(FONT_UNITS_PER_EM, fxMin, fyMin, fxMax, fyMax, 1),
    "hhea": buildHheaTable(FONT_ASCENT, FONT_DESCENT, FONT_ADVANCE, 0, 0, fxMax, numGlyphs),
    "hmtx": buildHmtxTable(advances),
    "loca": buildLocaTableLong(locaOffsets),
    "maxp": buildMaxpTable(numGlyphs, maxPoints, maxContours),
    "name": buildNameTable({
      1: familyName, 2: "Regular", 3: `${familyName};GodsLies;${key.seed}`,
      4: familyName, 5: "Version 1.0", 6: familyName.replace(/[^A-Za-z0-9]/g, "") + "-Regular",
    }),
    "post": buildPostTable(),
    "OS/2": buildOS2Table(FONT_ASCENT, FONT_DESCENT, FONT_ADVANCE),
  };
  return assembleFont(tables);
}

// --- copy-to-clipboard, with a file:// -safe fallback ---
function copyViaExec(text) {
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch { ok = false; }
  document.body.removeChild(ta);
  return ok;
}
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* fall through */ }
  }
  return copyViaExec(text);
}
function wireCopy(btnId, getText) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.onclick = async () => {
    const original = btn.textContent;
    const text = getText();
    if (!text) { btn.textContent = t("copy_nothing_yet"); setTimeout(() => { btn.textContent = original; }, 1000); return; }
    const ok = await copyText(text);
    btn.textContent = ok ? t("copy_copied") : t("copy_failed");
    setTimeout(() => { btn.textContent = original; }, 1200);
  };
}

// --- the one cipher picker + key generator, shared by Write and Read ---
function createCipherPanel() {
  const classicGallery = document.querySelector(".classic-gallery");
  const otherGallery = document.querySelector(".other-gallery");
  const clearBtn = document.querySelector(".clear-selection-btn");
  const seedInput = document.querySelector(".seed-input");
  const genBtn = document.querySelector(".gen-btn");
  const seedWordBtn = document.querySelector(".seed-word-btn");
  const downloadBtn = document.querySelector(".download-key-btn");
  const downloadFontBtn = document.querySelector(".download-font-btn");
  const keyStatus = document.querySelector(".key-status");
  const chartEl = document.querySelector(".chart-glyphs");

  const selection = { g0: null, g1: null, d0: null, d1: null };
  let currentKey = null;
  let chartClickHandler = null;
  let onKeyReadyCb = null;
  let onClearCb = null;

  // Rotating "next slot" pointer per type -- clicking a grid tile always
  // fills whichever grid slot is next in rotation (grid·1 then grid·2, then
  // back to grid·1, ...), independently of the diamond rotation. No need to
  // pre-target a slot first; that's the whole point (see cipher_hint).
  // Peek/advance are separate (not one atomic step) so a *blocked* click
  // (see assignByType -- same god already fills the other slot of this
  // type) can leave the pointer exactly where it was instead of quietly
  // consuming a turn: without that, a blocked click would still advance
  // past the slot that's actually still empty, so the very next click
  // (of a different god) would overwrite the already-filled slot instead
  // of landing on the empty one.
  let nextGrid = "g0", nextDiamond = "d0";
  function peekSlotOfType(prefix) { return prefix === "g" ? nextGrid : nextDiamond; }
  function advanceSlotOfType(prefix) {
    if (prefix === "g") nextGrid = (nextGrid === "g0") ? "g1" : "g0";
    else nextDiamond = (nextDiamond === "d0") ? "d1" : "d0";
  }

  function chipFor(slot) { return document.querySelector(`.block-tile[data-target="${slot}"]`); }
  function captionFor(slot) { return document.querySelector(`.slot-caption[data-target="${slot}"]`); }

  function buildGalleryInto(container, gods) {
    container.innerHTML = "";
    for (const [id, label] of gods) {
      const card = document.createElement("div");
      card.className = "name-card";
      card.dataset.name = id;
      card.innerHTML = `
        <span class="corner-tag g0">G1</span><span class="corner-tag g1">G2</span>
        <span class="corner-tag d0">D1</span><span class="corner-tag d1">D2</span>
        <div class="thumbs">
          <button class="g9" data-i18n-title="title_grid_style"><img src="${assetPath(id,'grid9','tile')}"></button>
          <button class="d4" data-i18n-title="title_diamond_style"><img src="${assetPath(id,'diamond4','tile')}"></button>
        </div>
        <div class="name">${label}</div>
      `;
      card.querySelector(".g9").title = t("title_grid_style");
      card.querySelector(".d4").title = t("title_diamond_style");
      card.querySelector(".g9").onclick = () => assignByType("g", id);
      card.querySelector(".d4").onclick = () => assignByType("d", id);
      container.appendChild(card);
    }
  }

  function refreshUI() {
    const cards = [...classicGallery.children, ...otherGallery.children];
    cards.forEach(card => {
      const id = card.dataset.name;
      card.querySelectorAll(".corner-tag").forEach(tag => tag.style.display = "none");
      const cardColors = [];
      for (const [slot, name] of Object.entries(selection)) {
        if (name === id) {
          cardColors.push(SLOT_COLORS[slot]);
          card.querySelector(`.corner-tag.${slot}`).style.display = "flex";
        }
      }
      // Whole-card border: solid if this god fills exactly one slot, a
      // gradient blend if it fills more (see blend() above).
      if (cardColors.length === 0) {
        card.style.borderColor = "";
        card.style.borderImage = "";
      } else if (cardColors.length === 1) {
        card.style.borderImage = "";
        card.style.borderColor = cardColors[0];
      } else {
        card.style.borderColor = "";
        card.style.borderImage = `${blend(cardColors)} 1`;
      }
      // Per-thumbnail "lit" tint: grid and diamond each highlighted
      // independently based on which of *their own* two slots (if any)
      // this god is currently filling.
      const gTints = SLOT_ORDER.filter(s => s[0] === "g" && selection[s] === id).map(s => SLOT_TINTS[s]);
      const dTints = SLOT_ORDER.filter(s => s[0] === "d" && selection[s] === id).map(s => SLOT_TINTS[s]);
      const g9btn = card.querySelector(".g9");
      const d4btn = card.querySelector(".d4");
      g9btn.classList.toggle("lit", gTints.length > 0);
      g9btn.style.background = gTints.length ? blend(gTints) : "";
      d4btn.classList.toggle("lit", dTints.length > 0);
      d4btn.style.background = dTints.length ? blend(dTints) : "";
    });
    for (const slot of SLOT_ORDER) {
      const name = selection[slot];
      const seg = slot[0] === "g" ? "grid9" : "diamond4";
      const chip = chipFor(slot);
      chip.classList.toggle("filled", !!name);
      const swatch = chip.querySelector(".swatch");
      const slotLabel = t(SLOT_LABEL_KEY[slot]);
      const caption = captionFor(slot);
      if (name) {
        swatch.innerHTML = `<img src="${assetPath(name, seg, 'tile')}">`;
        chip.title = `${slotLabel} — ${GOD_LABEL[name] || name}`;
        // Each god has exactly one code per segment type, so if the same
        // god fills both grid slots (or both diamond slots) their codes
        // would be identical -- show the name instead of two matching
        // numbers with no obvious reason why.
        const sameAsOther = selection[OTHER_SLOT_OF_TYPE[slot]] === name;
        caption.textContent = sameAsOther ? (GOD_LABEL[name] || name) : GOD_CODES[name][seg === "grid9" ? 0 : 1];
        caption.classList.toggle("duplicate", sameAsOther);
      } else {
        swatch.innerHTML = "";
        chip.title = slotLabel;
        caption.textContent = "";
        caption.classList.remove("duplicate");
      }
    }
  }

  function flashBlocked(slot) {
    const chip = chipFor(slot);
    chip.classList.add("blocked");
    setTimeout(() => chip.classList.remove("blocked"), 450);
  }

  // Never let the same god fill both slots of one segment type -- see
  // OTHER_SLOT_OF_TYPE's comment. A blocked click is simply rejected
  // (with a brief flash so it doesn't look like a dead/unresponsive
  // tile) rather than e.g. silently bumping the other slot empty.
  function assignByType(prefix, name) {
    const slot = peekSlotOfType(prefix);
    if (selection[OTHER_SLOT_OF_TYPE[slot]] === name) {
      flashBlocked(slot);
      return;
    }
    advanceSlotOfType(prefix);
    selection[slot] = name;
    refreshUI();
    maybeAutoGenerate();
  }

  function updateKeyStatusText() {
    keyStatus.innerHTML = "";
    if (currentKey) {
      const g = currentKey.grid9_gods.map(n => GOD_LABEL[n] || n).join(" + ");
      const d = currentKey.diamond4_gods.map(n => GOD_LABEL[n] || n).join(" + ");
      const title = document.createElement("div");
      title.className = "key-status-title";
      title.textContent = t("key_ready_title");
      keyStatus.appendChild(title);
      const rows = document.createElement("div");
      rows.className = "key-status-rows";
      for (const [label, value] of [
        [t("key_grid_label"), g],
        [t("key_diamond_label"), d],
        [t("key_seed_label"), `"${currentKey.seed}"`],
      ]) {
        const row = document.createElement("div");
        row.className = "key-status-row";
        const l = document.createElement("span"); l.className = "key-status-label"; l.textContent = label;
        const v = document.createElement("span"); v.className = "key-status-value"; v.textContent = value;
        row.append(l, v);
        rows.appendChild(row);
      }
      keyStatus.appendChild(rows);
    } else {
      keyStatus.textContent = t("key_status_empty");
    }
  }

  function setKey(key) {
    currentKey = key;
    keyStatus.classList.add("ready");
    updateKeyStatusText();
    renderChart(currentKey, chartEl, chartClickHandler);
    if (onKeyReadyCb) onKeyReadyCb(currentKey);
  }

  function maybeAutoGenerate() {
    if (selection.g0 && selection.g1 && selection.d0 && selection.d1) {
      const seed = seedInput.value.trim();
      setKey(generateKey([selection.g0, selection.g1], [selection.d0, selection.d1], seed || null));
    }
  }

  genBtn.onclick = () => {
    if (!selection.g0 || !selection.g1 || !selection.d0 || !selection.d1) {
      alert(t("alert_choose_4_slots"));
      return;
    }
    const seed = seedInput.value.trim();
    setKey(generateKey([selection.g0, selection.g1], [selection.d0, selection.d1], seed || null));
  };

  seedWordBtn.onclick = () => {
    const word = SEED_WORDS[Math.floor(Math.random() * SEED_WORDS.length)];
    seedInput.value = word;
    if (selection.g0 && selection.g1 && selection.d0 && selection.d1) {
      setKey(generateKey([selection.g0, selection.g1], [selection.d0, selection.d1], word));
    }
  };

  downloadBtn.onclick = () => {
    if (!currentKey) { alert(t("alert_generate_key_first")); return; }
    const blob = new Blob([JSON.stringify(currentKey, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `gods-lies-key-${currentKey.seed}.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  downloadFontBtn.onclick = () => {
    if (!currentKey) { alert(t("alert_generate_key_first")); return; }
    const original = downloadFontBtn.textContent;
    downloadFontBtn.textContent = t("generating_font");
    // One frame's delay so the button label above actually paints before
    // the (synchronous, if brief) build work blocks the main thread.
    setTimeout(() => {
      const bytes = buildFontFromKey(currentKey, `Gods Lies - ${currentKey.seed}`);
      const blob = new Blob([bytes], { type: "font/ttf" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = `gods-lies-font-${currentKey.seed}.ttf`;
      a.click();
      URL.revokeObjectURL(url);
      downloadFontBtn.textContent = original;
    }, 30);
  };

  clearBtn.onclick = () => {
    for (const slot of SLOT_ORDER) selection[slot] = null;
    nextGrid = "g0"; nextDiamond = "d0";
    currentKey = null;
    keyStatus.classList.remove("ready");
    updateKeyStatusText();
    chartEl.innerHTML = "";
    refreshUI();
    if (onClearCb) onClearCb();
  };

  buildGalleryInto(classicGallery, CLASSIC_GODS);
  buildGalleryInto(otherGallery, OTHER_GODS);
  refreshUI();

  return {
    getKey: () => currentKey,
    setChartClickHandler(fn) { chartClickHandler = fn; },
    onKeyReady(fn) { onKeyReadyCb = fn; },
    onClear(fn) { onClearCb = fn; },
    // Called after a language switch: refresh anything holding
    // language-dependent text that isn't just a static data-i18n sweep.
    refreshLanguage() {
      updateKeyStatusText();
      refreshUI();
      if (currentKey) renderChart(currentKey, chartEl, chartClickHandler);
    },
  };
}

const cipher = createCipherPanel();

// --- Write ---
let lastWriteCoded = "";
let lastWriteFull = "";
let lastWriteMood = "";
let lastWritePunct = "";

// Seed the plaintext/mood/punctuation fields with a random sample so
// there's something to Encode right away -- cleared the moment the
// plaintext box is actually focused (not on every focus: only while
// it's still the untouched sample, so tabbing back into a real
// in-progress message never wipes it).
let plaintextIsSample = true;
(function seedSampleMessage() {
  document.getElementById("write-plainText").value =
    SAMPLE_MESSAGES[Math.floor(Math.random() * SAMPLE_MESSAGES.length)];
  document.getElementById("write-moodInput").value =
    SAMPLE_MOODS[Math.floor(Math.random() * SAMPLE_MOODS.length)];
  document.getElementById("write-punctInput").value =
    SAMPLE_PUNCT[Math.floor(Math.random() * SAMPLE_PUNCT.length)];
})();
document.getElementById("write-plainText").addEventListener("focus", () => {
  if (plaintextIsSample) {
    document.getElementById("write-plainText").value = "";
    plaintextIsSample = false;
  }
});

document.getElementById("write-encodeBtn").onclick = () => {
  const key = cipher.getKey();
  if (!key) { alert(t("alert_choose_4_styles")); return; }
  const coded = encode(document.getElementById("write-plainText").value, key);
  lastWriteCoded = coded;
  lastWriteMood = document.getElementById("write-moodInput").value.trim();
  lastWritePunct = document.getElementById("write-punctInput").value.trim();
  renderWriteResult(coded, lastWriteMood, lastWritePunct, key, document.getElementById("write-encodeGlyphs"));

  const slotA = godRefCode(key.grid9_gods[0], key.diamond4_gods[0]);
  const slotB = godRefCode(key.grid9_gods[1], key.diamond4_gods[1]);
  const header = `${lastWriteMood}_${slotA}_${slotB}_${key.seed}_${lastWritePunct}`;
  lastWriteFull = `${header}\n${coded}\n#`;
  document.getElementById("write-headerLine").textContent = t("header_line", { header });
  document.getElementById("write-fullTextOut").value = lastWriteFull;
};

wireCopy("write-copyGlyphsBtn", () => lastWriteCoded);
wireCopy("write-copyFullBtn", () => lastWriteFull);

// --- Read: the alphabet chart above (in "Your key") is the click-to-build
// decode surface -- clicking a symbol there appends it to the sequence. ---
let readDecodeSeq = [];

function renderReadSequence() {
  const key = cipher.getKey();
  renderGlyphStream(readDecodeSeq, key, document.getElementById("read-sequenceStrip"), (i) => {
    readDecodeSeq.splice(i, 1);
    renderReadSequence();
  });
  document.getElementById("read-plainOut").value = key ? decode(readDecodeSeq.join(" "), key) : "";
}

cipher.setChartClickHandler((seg, which, pos) => {
  readDecodeSeq.push(slotCode(seg, which, pos));
  renderReadSequence();
});
cipher.onKeyReady(() => renderReadSequence());
cipher.onClear(() => { readDecodeSeq = []; renderReadSequence(); });

document.getElementById("read-spaceBtn").onclick = () => { readDecodeSeq.push("/"); renderReadSequence(); };
document.getElementById("read-undoBtn").onclick = () => { readDecodeSeq.pop(); renderReadSequence(); };
document.getElementById("read-clearSeqBtn").onclick = () => { readDecodeSeq = []; renderReadSequence(); };

wireCopy("read-copyPlainBtn", () => document.getElementById("read-plainOut").value);

let lastPasteMood = "", lastPasteVal = "";

// --- Read: one paste box, header optional. If the first line parses as a
// mood_slotA_slotB_seed_punctuation header, its own codes rebuild the key
// (even a different one than what's selected above); otherwise the whole
// paste is treated as coded body and decoded with the key selected above. ---
document.getElementById("read-pasteBtn").onclick = () => {
  const raw = document.getElementById("read-pasteIn").value;
  const lines = raw.split("\n").map(l => l.trim()).filter(l => l && l !== "#");
  if (!lines.length) { alert(t("alert_paste_first")); return; }

  const headerParts = lines[0].split("_");
  let mood = "", slotA = "", slotB = "", seed = "", punct = "", key = null, body = "";
  const looksLikeHeader = headerParts.length === 5
    && parseGodRef(headerParts[1])[0] && parseGodRef(headerParts[2])[0];

  if (looksLikeHeader) {
    [mood, slotA, slotB, seed, punct] = headerParts;
    try {
      key = keyFromHeader(slotA, slotB, seed);
    } catch (e) {
      document.getElementById("read-pasteOut").value = t("couldnt_derive_key", { msg: e.message });
      document.getElementById("read-pasteMoodPunct").textContent = "";
      return;
    }
    body = lines.slice(1).join(" ");
  } else {
    key = cipher.getKey();
    if (!key) {
      alert(t("alert_no_header_no_key"));
      return;
    }
    body = lines.join(" ");
  }

  lastPasteMood = mood; lastPasteVal = punct;
  document.getElementById("read-pasteOut").value = decode(body, key);
  document.getElementById("read-pasteMoodPunct").textContent =
    (mood || punct) ? t("mood_punct_display", { mood: mood || "—", punct: punct || "—" }) : "";
};

wireCopy("read-copyPasteBtn", () => document.getElementById("read-pasteOut").value);

// --- step-3 local tabs: Write / Read ---
document.querySelectorAll(".tabbtn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".tabbtn").forEach(b => b.classList.toggle("active", b === btn));
    document.querySelectorAll(".tabpanel").forEach(p => p.classList.toggle("active", p.dataset.tab === btn.dataset.tab));
  };
});

// --- language toggle: sweeps every data-i18n* element, then asks the
// cipher panel (and any currently-shown write/paste result) to refresh
// whatever language-dependent text isn't covered by a static sweep. ---
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem("godslies-lang", lang);
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if (STRINGS[lang][key] !== undefined) el.textContent = STRINGS[lang][key];
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    const key = el.dataset.i18nHtml;
    if (STRINGS[lang][key] !== undefined) el.innerHTML = STRINGS[lang][key];
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if (STRINGS[lang][key] !== undefined) el.placeholder = STRINGS[lang][key];
  });
  document.querySelectorAll("[data-i18n-title]").forEach(el => {
    const key = el.dataset.i18nTitle;
    if (STRINGS[lang][key] !== undefined) el.title = STRINGS[lang][key];
  });
  // footer_text is deliberately English-only in both languages (see the fr
  // STRINGS block) -- the sweep above skips it when the key is missing, so
  // force it here rather than leaving a blank span on first fr load.
  document.querySelector('[data-i18n="footer_text"]').textContent = STRINGS.en.footer_text;

  const toggleBtn = document.getElementById("langToggleBtn");
  toggleBtn.textContent = lang === "en" ? t("lang_switch_to_fr") : t("lang_switch_to_en");
  updateThemeToggleLabel();

  cipher.refreshLanguage();
  renderReadSequence();
  if (lastWriteCoded || lastWriteMood || lastWritePunct) {
    renderWriteResult(lastWriteCoded, lastWriteMood, lastWritePunct, cipher.getKey(), document.getElementById("write-encodeGlyphs"));
  }
  if (lastPasteMood || lastPasteVal) {
    document.getElementById("read-pasteMoodPunct").textContent = t("mood_punct_display", { mood: lastPasteMood || "—", punct: lastPasteVal || "—" });
  }
}

document.getElementById("langToggleBtn").onclick = () => {
  applyLanguage(currentLang === "en" ? "fr" : "en");
};

// --- theme toggle: manual override for the OS-level prefers-color-scheme
// default, stored the same way the language choice is. The head script
// above already applies any saved choice before first paint. ---
function effectiveTheme() {
  const explicit = document.documentElement.getAttribute("data-theme");
  if (explicit) return explicit;
  return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function updateThemeToggleLabel() {
  const eff = effectiveTheme();
  document.getElementById("themeToggleBtn").textContent =
    eff === "dark" ? t("theme_switch_to_light") : t("theme_switch_to_dark");
}
document.getElementById("themeToggleBtn").onclick = () => {
  const next = effectiveTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("godslies-theme", next);
  updateThemeToggleLabel();
};

applyLanguage(currentLang);
</script>
</body>
</html>
